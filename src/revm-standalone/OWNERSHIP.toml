# Ownership map for the canonical standalone runtime.
#
# Paths are relative to standalone_root. A mirrored path is required to be
# byte-identical to the same path below upstream_root. A fork is allowed to
# differ, but records the exact upstream bytes from which it was forked. A
# standalone-only path must not exist in the upstream tree.
format = 1
upstream_root = "src/revm"
standalone_root = "src/revm-standalone"
manifest_file = "OWNERSHIP.toml"

# Prefixes make newly added files in these runtime areas owned by default.
# Files outside these prefixes must be listed explicitly below.
mirrored_prefixes = [
  "src/sid",
]

mirrored_files = [
  "CMakeLists.txt",
  "COPYING.Frodo",
  "LICENSE",
  "src/input/IInputSource.hpp",
  "src/input/InputState.hpp",
  "src/vendor/frodo/CPU_common.cpp",
  "src/vendor/frodo/CPU_common.h",
  "src/vendor/frodo/CPU_emulcycle.h",
  "src/vendor/frodo/MenuFont.h",
  "src/vendor/frodo/SID.cpp",
  "src/vendor/frodo/SID.h",
  "src/vendor/frodo/SID_catweasel.h",
  "src/vendor/frodo/SID_wave_tables.h",
  "src/vendor/frodo/VIC.h",
  "src/vendor/frodo/Version.h",
  "src/vendor/frodo/debug.h",
  "src/vendor/frodo/frodo_globals.cpp",
  "src/vendor/frodo/main.h",
  "src/vendor/frodo/sysconfig.h",
  "src/vendor/frodo/sysdeps.h",
  "src/vendor/nlohmann/json.hpp",
]

standalone_only = [
  "STANDALONE.md",
  "src/core/StandaloneRunner.cpp",
  "src/core/StandaloneRunner.hpp",
  "src/gamehost/GameHost.cpp",
  "src/gamehost/GameHost.hpp",
  "src/gamehost/Log.hpp",
]

